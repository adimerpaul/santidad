name: san2
description: "App de pre-venta Farmacia Santidad — pedidos, stock por sucursal y sucursales en mapa."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado (MVVM)
  provider: ^6.1.5

  # Red y configuración
  http: ^1.5.0
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.3

  # Mapa Leaflet (WebView con Leaflet 1.9.4 + OpenStreetMap)
  webview_flutter: ^4.13.0

  # Utilidades
  url_launcher: ^6.3.2
  intl: ^0.20.2
  google_fonts: ^6.3.2

  # Íconos de marca (logo oficial de WhatsApp)
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - .env.production
    - assets/logo.png

# Íconos de la app (Android/iOS) generados desde el logo oficial:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: false # el proyecto solo tiene plataforma Android
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo_foreground.png"
